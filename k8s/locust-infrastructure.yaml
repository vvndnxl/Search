apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-script-config
  namespace: default
data:
  locustfile.py: |
    # Сюда при деплое автоматически вставится весь код нашего сценария из Этапа 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      role: locust-master
  template:
    metadata:
      labels:
        role: locust-master
    spec:
      containers:
        - name: locust-master
          image: locustio/locust:2.24.1
          args: ["--master"]
          ports:
            - containerPort: 8089 # Веб-интерфейс Locust
            - containerPort: 5557 # Порт коммуникации с воркерами
          volumeMounts:
            - name: script-volume
              mountPath: /home/locust
      volumes:
        - name: script-volume
          configMap:
            name: locust-script-config
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master-service
  namespace: default
spec:
  ports:
    - port: 8089
      targetPort: 8089
      name: web
    - port: 5557
      targetPort: 5557
      name: communication
  selector:
    role: locust-master
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-workers
  namespace: default
spec:
  replicas: 4 # 4 параллельных пода будут нещадно бомбить наше API запросами
  selector:
    matchLabels:
      role: locust-worker
  template:
    metadata:
      labels:
        role: locust-worker
    spec:
      containers:
        - name: locust-worker
          image: locustio/locust:2.24.1
          # Говорим воркерам слать трафик на внутренний сервис нашего FastAPI
          args: ["--worker", "--master-host=locust-master-service", "--html=report.html"]
          env:
            - name: LOCUST_TARGET_HOST
              value: "http://search-api-service:8000"
          volumeMounts:
            - name: script-volume
              mountPath: /home/locust
      volumes:
        - name: script-volume
          configMap:
            name: locust-script-config
