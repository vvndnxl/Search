services:
  postgres_db:
    image: postgres:15-alpine
    container_name: search_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=search_db
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d search_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - search_network

  elasticsearch:
    image: elasticsearch:9.4.1
    container_name: search_elastic
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=false
    expose:
      - "9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200/_cluster/health" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - search_network

  redis:
    image: redis:7.4.1-alpine
    container_name: search_redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - search_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: search_kafka
    restart: unless-stopped
    expose:
      - "9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://search_kafka:9092
      - KAFKA_CONTROLLER_LOCAL_LISTENERS=CONTROLLER://0.0.0.0:9093
      - KAFKA_EXPOSED_LISTENERS=PLAINTEXT://search_kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@search_kafka:9093
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - search_network

  api:
    build: .
    container_name: search_api
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=search_postgres
      - ELASTIC_HOST=search_elastic
      - ELASTIC_PORT=9200
      - KAFKA_BOOTSTRAP_SERVERS=search_kafka:9092
      - REDIS_HOST=search_redis
      - REDIS_PORT=6379
      - PYTHONPATH=.
    depends_on:
      postgres_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - search_network

  worker:
    build: .
    container_name: search_worker
    restart: unless-stopped
    command: python -m app.worker
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=search_postgres
      - ELASTIC_HOST=search_elastic
      - ELASTIC_PORT=9200
      - KAFKA_BOOTSTRAP_SERVERS=search_kafka:9092
      - REDIS_HOST=search_redis
      - REDIS_PORT=6379
      - PYTHONPATH=.
    depends_on:
      postgres_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - search_network

networks:
  search_network:
    driver: bridge

volumes:
  pgdata:
  esdata:
